# Application Configuration
spring.application.name=opentelemetry-jms-demo

# Server Configuration
server.port=8080

# JMS / Azure Service Bus Configuration

## Application Mode
# Set to "production" for Azure Service Bus, leave as "demo" for in-memory JMS
app.mode=demo

## Azure Service Bus Configuration (for production mode)
# Required when app.mode=production
app.azure.servicebus.namespace=
app.azure.servicebus.entity-name=demo-queue
app.azure.servicebus.entity-type=queue  # "queue" or "topic"

## Azure AD Authentication (for production mode with token authentication)
app.azure.tenant-id=
app.azure.client-id=
app.azure.client-secret=

# Spring JMS Configuration
spring.jms.listener.auto-startup=true
spring.jms.listener.acknowledge-mode=auto
spring.jms.listener.concurrency=1
spring.jms.listener.max-concurrency=3

# Spring Boot Artemis (Demo Mode) Configuration
# These are ignored in production mode
spring.artemis.mode=embedded
spring.artemis.broker-url=vm://0
spring.artemis.user=demo
spring.artemis.password=demo
spring.artemis.embedded.queues=demo-queue
spring.artemis.embedded.topics=demo-topic

# Logging Configuration
logging.level.otel=DEBUG
logging.level.org.springframework.jms=DEBUG
logging.level.com.azure=INFO

# To enable detailed JMS logging, uncomment below:
# logging.level.org.springframework.jms.listener=TRACE
# logging.level.com.azure.servicebus.jms=TRACE
