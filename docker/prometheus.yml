global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'opentelemetry-local'

# Scrape configs
scrape_configs:
  # Scrape OpenTelemetry Collector's own metrics
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:9464']
        labels:
          service: 'otel-collector'

  # Scrape Spring Boot Actuator metrics directly
  - job_name: 'spring-boot-app'
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          service: 'opentelemetry-demo'
          application: 'opentelemetry-jms-demo'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s
    scrape_timeout: 10s
