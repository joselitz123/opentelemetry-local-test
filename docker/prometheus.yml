global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'opentelemetry-local'

# Scrape configs
scrape_configs:
  # Scrape OpenTelemetry Collector's own metrics
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:9464']
        labels:
          service: 'otel-collector'
