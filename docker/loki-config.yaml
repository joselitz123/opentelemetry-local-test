server:
  http_listen_address: 0.0.0.0
  http_listen_port: 3100

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

# Disable authentication for local development
auth_enabled: false

schema_config:
  configs:
    - from: 2024-01-01
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      index:
        prefix: loki_index_
        period: 24h

storage_config:
  filesystem:
    directory: /loki

compactor:
  working_directory: /loki/compactor

limits_config:
  # Relaxed limits for local development
  # enforce_metric_name removed in Loki 3.x
  reject_old_samples: false
  reject_old_samples_max_age: 168h
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  # New Loki 3.x settings
  max_streams_per_user: 0
  max_global_streams_per_user: 0
  # Allow structured metadata for OTLP (requires schema v13 + tsdb index)
  # For now, disable to allow v11 schema with boltdb-shipper
  allow_structured_metadata: false
