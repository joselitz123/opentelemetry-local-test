receivers:
  # OTLP receiver for traces, metrics, logs from application
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Batch telemetry for efficient export
  batch:
    timeout: 1s
    send_batch_size: 1024

  # Add resource attributes (optional enrichment)
  resource:
    attributes:
      - key: environment
        value: local
        action: upsert

  # Memory limiter to prevent OOM
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

exporters:
  # Prometheus exporter for metrics
  prometheusremotewrite:
    endpoint: http://prometheus:9090/api/v1/write

  # Tempo exporter for traces
  otlp/tempo:
    endpoint: http://tempo:4317
    tls:
      insecure: true

  # OTLP HTTP exporter for logs to Loki (Loki 3.x supports OTLP natively)
  otlphttp/loki:
    endpoint: http://loki:3100/otlp/v1/logs
    tls:
      insecure: true

  # Debug exporter for troubleshooting
  debug:
    verbosity: normal

extensions:
  # Health check extension
  health_check:
    endpoint: 0.0.0.0:13133

  # Pprof for profiling
  pprof:
    endpoint: 0.0.0.0:1777

service:
  extensions: [health_check, pprof]
  pipelines:
    # Traces pipeline: App -> Collector -> Tempo
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [otlp/tempo, debug]

    # Metrics pipeline: App -> Collector -> Prometheus
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [prometheusremotewrite, debug]

    # Logs pipeline: App -> Collector -> Loki (via OTLP)
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [otlphttp/loki, debug]
