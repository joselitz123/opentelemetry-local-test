services:
  # OpenTelemetry Collector - Central Telemetry Pipeline
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    container_name: otel-collector
    command: [--config=/etc/otelcol-contrib/config.yaml]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
      - "8888:8888"   # Prometheus metrics exporter
      - "9464:9464"   # Collector's own metrics
      - "13133:13133" # Health check
    networks:
      - observability
    restart: unless-stopped
    depends_on:
      - prometheus
      - tempo
      - loki
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "--health-check"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Prometheus - Metrics Storage and Scraping
  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
      - --enable-feature=exemplar-storage
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - observability
    restart: unless-stopped

  # Grafana Tempo - Distributed Tracing Backend
  tempo:
    image: grafana/tempo:2.5.0
    container_name: tempo
    command: [-config.file=/etc/tempo/config.yaml]
    volumes:
      - ./tempo-config.yaml:/etc/tempo/config.yaml:ro
      - tempo-data:/tmp/tempo
    ports:
      - "3200:3200"   # Tempo query API
    networks:
      - observability
    restart: unless-stopped

  # Grafana Loki - Log Aggregation
  loki:
    image: grafana/loki:2.9.10
    container_name: loki
    command: [-config.file=/etc/loki/local-config.yaml]
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"   # Loki API
    networks:
      - observability
    restart: unless-stopped

  # Grafana - Unified Visualization
  grafana:
    image: grafana/grafana:10.3.1
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    networks:
      - observability
    restart: unless-stopped
    depends_on:
      - prometheus
      - tempo
      - loki

networks:
  observability:
    driver: bridge

volumes:
  prometheus-data:
  tempo-data:
  loki-data:
  grafana-data:
